[package]
name = "dtac"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
unused_qualifications = "warn"

[lints.clippy]
# Lint groups get a negative priority so individual lints can override them
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }

# Specific strict warnings
unwrap_used = "warn"
expect_used = "warn"

# Allowed exceptions that override the 'pedantic' group
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"

[dependencies]
thiserror = "2"
anyhow = "1"

# --- Library Observability ---
# The library uses these to emit logs and metrics without caring where they go.
tracing = "0.1"
opentelemetry = { version = "0.22", features = ["metrics"] }

# --- Binary Runtime & Exporters ---
# The binary uses these to run the app and export the telemetry.
tokio = { version = "1", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-opentelemetry = "0.23"
opentelemetry_sdk = { version = "0.22", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.15", features = ["metrics"] }
rand = "0.8"
num_cpus = "1.17.0"
clap = { version = "4.6.6", features = ["derive"] }
axum = { version = "0.8.9", features = ["macros"] }
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
bytes = "1.12.1"
opentelemetry-prometheus = "0.15.0"
prometheus = "0.13.4"
serde = { version = "1.0.229", features = ["derive"] }
indicatif = "0.18.6"
futures = "0.3.34"
serde_json = "1.0.151"

# --- Benchmark-only baseline ---
# Used only by src/bin/replay_bench.rs to build a standard, bot-unaware
# sharded LRU cache as a comparison baseline against DTAC's own engine.
lru = "0.12"
